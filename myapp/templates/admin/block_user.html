{% extends "admin/admin_base.html" %}
{% block content %}

<h3>Block User</h3>

<div class="card p-4 shadow">
    <p>Are you sure you want to block <strong>{{ user_obj.username }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-warning">Confirm Block</button>
        <a href="{% url 'manage_users' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
