{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Easy Interview</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
</head>
<body>

<button id="theme-toggle" class="btn-outline-glass" style="position: absolute; top: 1rem; right: 1rem; padding: 0.4rem 0.8rem; border-radius: 50%; font-size: 1.2rem; cursor: pointer; border: none; background: var(--bg-glass); z-index: 1000;">☀️</button>

<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card animate-in">
            <div class="auth-logo">
                <svg class="logo-mic" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;">
                    <path d="M12 1C10.3431 1 9 2.34315 9 4V12C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12V4C15 2.34315 13.6569 1 12 1Z" fill="url(#logo-grad)" />
                    <path d="M19 10V11C19 14.866 15.866 18 12 18C8.13401 18 5 14.866 5 11V10" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
                    <path d="M12 18V22" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
                    <path d="M8 22H16" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
                    <defs>
                        <linearGradient id="logo-grad" x1="5" y1="1" x2="19" y2="22" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1" />
                            <stop offset="1" stop-color="#a855f7" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>Set Password</h1>
                <p>Recovery for <strong>{{ email }}</strong></p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group" style="position: relative;">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" name="password" id="reset-password" placeholder="••••••••" required style="padding-right: 40px;">
                    <button type="button" onclick="togglePassword('reset-password')" style="position: absolute; right: 12px; top: 36px; background: none; border: none; cursor: pointer; font-size: 16px;">
                        <span id="reset-password-icon">👁️</span>
                    </button>
                </div>
                <div class="form-group" style="position: relative;">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="confirm" id="confirm-password" placeholder="••••••••" required style="padding-right: 40px;">
                    <button type="button" onclick="togglePassword('confirm-password')" style="position: absolute; right: 12px; top: 36px; background: none; border: none; cursor: pointer; font-size: 16px;">
                        <span id="confirm-password-icon">👁️</span>
                    </button>
                </div>
                <button type="submit" class="btn-primary-glow btn-block btn-lg">
                    Reset Password →
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(inputId + '-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = '🙈';
    } else {
        input.type = 'password';
        icon.innerText = '👁️';
    }
}
</script>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    function updateThemeIcon(isLight) {
        if(themeToggle) themeToggle.innerText = isLight ? '🌙' : '☀️';
    }
    const isLightTheme = localStorage.getItem('theme') === 'light';
    if (isLightTheme) {
        document.body.classList.add('light-theme');
        updateThemeIcon(true);
    }
    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon(isLight);
        });
    }
</script>
</body>
</html>
