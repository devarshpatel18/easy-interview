{% extends 'myapp/base.html' %}
{% block page_title %}<span>Update Profile</span>{% endblock %}

{% block content %}
<div class="animate-in" style="max-width: 500px;">
    <h1 class="page-title">Update Profile ✏️</h1>
    <p class="page-subtitle">Update your account information.</p>

    <div class="glass-card">
        <form method="POST" action="{% url 'update_profile' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" value="{{ request.user.username }}">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ request.user.email }}">
            </div>
            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn-primary-glow">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn-outline-glass">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
