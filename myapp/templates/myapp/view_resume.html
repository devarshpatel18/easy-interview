{% extends 'myapp/base.html' %}
{% block nav_view_resume %}active{% endblock %}
{% block page_title %}<span>View Resume</span>{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="text-center" style="margin-bottom: 24px;">
        <h1 class="page-title">Your Current Resume 📄</h1>
        <p class="page-subtitle">This is the latest resume we have on file for you.</p>
    </div>
</div>

<div class="glass-card animate-in delay-1" style="height: 75vh; padding: 0; overflow: hidden; border: 1px solid var(--border-glass); position: relative; background: #1e1b4b;">
    <!-- Google Docs PDF Viewer for Mobile Compatibility -->
    <iframe src="https://docs.google.com/viewer?url={{ request.scheme }}://{{ request.get_host }}{{ resume_url }}&embedded=true" width="100%" height="100%" style="border: none;">
        <p style="text-align: center; color: white;">Your browser does not support iframes.</p>
    </iframe>
</div>

<div class="text-center mt-4 animate-in delay-2" style="display: flex; gap: 16px; justify-content: center; margin-top: 24px;">
    <a href="{% url 'download_user_resume' %}" class="btn-outline-glass btn-lg">
        ⬇️ Download PDF
    </a>
    <a href="{% url 'resume' %}" class="btn-primary-glow btn-lg">
        📤 Upload a New Resume Instead
    </a>
</div>
{% endblock %}
